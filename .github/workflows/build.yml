name: Limiar

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Windows workflow safety tests (mock providers)
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/windows_workflow.ps1
      - name: ISO builder dependencies
        run: python -m pip install --target target/test-python --require-hashes --only-binary=:all: -r runtime/windows-tools-requirements.txt
      - name: ISO builder tests
        env:
          PYTHONPATH: target/test-python
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Linux guest probe source checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n scripts/build-linux-probe.sh scripts/build-linux-gpu-probe.sh
          sh -n guest/linux/probe-init.sh
          headers="$RUNNER_TEMP/directx-headers"
          git init "$headers"
          git -C "$headers" remote add origin "$(jq -r .repository runtime/directx-headers.json)"
          git -C "$headers" fetch --depth 1 origin "$(jq -r .revision runtime/directx-headers.json)"
          git -C "$headers" checkout --detach FETCH_HEAD
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -isystem "$headers/include" -isystem "$headers/include/wsl/stubs" \
            guest/linux/gpu-probe.cpp
      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release --locked -p limiar
      - name: Portable Windows build
        if: runner.os == 'Windows'
        run: ./scripts/Build-PortableCli.ps1
      - name: CLI smoke
        run: cargo run --locked -- --help
      - name: Collect dependency notices
        if: runner.os == 'Windows'
        run: ./scripts/Write-ThirdPartyNotices.ps1 -OutputPath target/release/THIRD_PARTY_NOTICES.txt
      - name: Upload Windows CLI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: limiar-cli-windows-x64
          path: |
            target/portable/x86_64-pc-windows-msvc/release/limiar.exe
            README.md
            LICENSE-MIT
            LICENSE-APACHE
            target/release/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
